# nginx for the OhMyWind web bundle. Mirrors what Cloudflare Pages applies
# through packages/web/public/_headers and _redirects, which nginx does not
# read: keep the three in sync.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Probe target for the container runtime and the chart.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The service worker must be revalidated on every launch or installed
    # PWAs keep the old one for hours and never see a deploy (_headers).
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Vite hashes everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Play Console's URL checker requires a 200 on the privacy policy, not
    # the generic 404-status SPA fallback (_redirects).
    location = /confidentialite {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Same as Cloudflare Pages: unknown paths serve 404.html with a real 404
    # status. `=404` rather than `/404.html` as the try_files fallback: the
    # latter is an internal rewrite and answers 200.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
