# Default values for ohmywind-mcp.

replicaCount: 1

image:
  repository: ghcr.io/qdonnars/ohmywind-mcp
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Server configuration, surfaced 1:1 as environment variables read by
# packages/hf-space/app.py and security.py.
config:
  # Host headers accepted on /mcp by FastMCP's DNS-rebinding protection;
  # anything else answers 421. Matched as host:port ("localhost:*" for a
  # wildcard port). Add every hostname MCP clients will use. The REST routes
  # and /healthz are not guarded, so probes work regardless.
  allowedHosts:
    - mcp.ohmywind.fr
  # Number of trusted proxy hops in X-Forwarded-For (ingress controller = 1,
  # add one per extra layer such as a CDN in front of the ingress).
  trustedProxyHops: 1
  rateLimit:
    requests: 30
    windowSeconds: 60
    maxTrackedIps: 5000
  # CSP frame-ancestors. Nothing frames the landing page outside HF.
  frameAncestors: "'none'"
  # Free-form extra environment variables.
  extraEnv: []
  #  - name: OPENWIND_ALLOWED_ORIGINS
  #    value: https://ohmywind.fr

# Shared secret the edge proxy (packages/edge-proxy) presents; requests that
# carry it are trusted as coming through the edge. Leave both empty to run
# without an edge (the server logs a warning at boot and treats every caller
# as direct).
edgeSecret:
  value: ""
  # Name of an existing Secret with key OPENWIND_EDGE_SECRET; takes precedence
  # over .value.
  existingSecret: ""

# Bearer token(s) required on /mcp (Authorization: Bearer <token>). Empty =
# open endpoint. Comma-separate several tokens to rotate without downtime.
# The REST routes and /healthz are never token-protected: the public web
# bundle calls them, so a token there would ship in the JavaScript.
auth:
  token: ""
  # Name of an existing Secret with key OPENWIND_API_TOKEN; takes precedence
  # over .token.
  existingSecret: ""

# Tidal atlas dataset (MARC PREVIMER + SHOM C2D), mounted at /data/atlas.
# Private and not redistributable, so it is never in the image: provide it
# through a PVC you populate yourself. Disabled = Open-Meteo SMOC only.
atlas:
  enabled: false
  existingClaim: ""
  # Used only when existingClaim is empty and enabled is true.
  storageClassName: ""
  accessModes: [ReadOnlyMany]
  size: 2Gi

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: mcp.ohmywind.fr
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ohmywind-mcp-tls
  #    hosts: [mcp.ohmywind.fr]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Streamable-HTTP MCP sessions are held in memory by the pod that opened
# them. Above one replica, the ingress must pin a client to a pod (cookie or
# consistent-hash session affinity) or sessions break mid-conversation.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# ------------------------------------------------------------------ web app
# The static React bundle (packages/web) behind nginx, from
# deploy/docker/Dockerfile.web. Optional: the upstream deployment serves it
# from Cloudflare Pages instead. The backend URL is compiled into the bundle
# at image build time (VITE_API_BASE), so the image must have been built for
# the MCP host this release exposes.
web:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/qdonnars/ohmywind-web
    pullPolicy: IfNotPresent
    # Defaults to the chart's appVersion.
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    # Falls back to .Values.ingress.className when empty.
    className: ""
    annotations: {}
    hosts:
      - host: ohmywind.example.org
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}
