{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ohmywind-mcp.web.fullname" . }}-test-connection"
  labels:
    {{- include "ohmywind-mcp.web.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args:
        - -fsS
        - "http://{{ include "ohmywind-mcp.web.fullname" . }}:{{ .Values.web.service.port }}/healthz"
{{- end }}
