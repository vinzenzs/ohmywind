apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ohmywind-mcp.fullname" . }}-test-connection"
  labels:
    {{- include "ohmywind-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args:
        - -fsS
        - -H
        - "Host: {{ first .Values.config.allowedHosts }}"
        - "http://{{ include "ohmywind-mcp.fullname" . }}:{{ .Values.service.port }}/healthz"
