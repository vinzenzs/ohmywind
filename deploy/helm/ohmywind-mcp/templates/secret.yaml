{{- if include "ohmywind-mcp.rendersSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ohmywind-mcp.fullname" . }}
  labels:
    {{- include "ohmywind-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.edgeSecret.value (not .Values.edgeSecret.existingSecret) }}
  OPENWIND_EDGE_SECRET: {{ .Values.edgeSecret.value | quote }}
  {{- end }}
  {{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
  OPENWIND_API_TOKEN: {{ .Values.auth.token | quote }}
  {{- end }}
{{- end }}
