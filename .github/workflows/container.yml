name: Container & Helm chart

# Builds the generic OCI images (deploy/docker/Dockerfile for the server,
# Dockerfile.web for the static web app) and validates the Helm chart
# (deploy/helm/ohmywind-mcp) on every change that can affect them.
# Publishing follows the same branch → environment mapping as the rest of the
# repo (CLAUDE.md): main → `latest`, dev → `dev`, tags v* → semver. Pull
# requests build and smoke-test but never push.
#
# The chart is published as an OCI artefact next to the image
# (oci://ghcr.io/<owner>/charts/ohmywind-mcp) on release tags only: a chart
# version is a deliberate cut, not every commit.
on:
  pull_request:
    paths:
      - "packages/hf-space/**"
      - "packages/mcp-core/**"
      - "packages/data-adapters/**"
      - "packages/web/**"
      - "package.json"
      - "package-lock.json"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  push:
    branches: [main, dev]
    paths:
      - "packages/hf-space/**"
      - "packages/mcp-core/**"
      - "packages/data-adapters/**"
      - "packages/web/**"
      - "package.json"
      - "package-lock.json"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ohmywind-mcp
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ohmywind-web
  CHART_DIR: deploy/helm/ohmywind-mcp

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main → latest, dev → dev, v1.2.3 → 1.2.3 + 1.2, every push → sha-<short>.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch build loaded into the local daemon so it can actually be
      # started. The multi-arch push below reuses every layer from the cache.
      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ohmywind-mcp:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the server under the chart's security posture (read-only root,
      # non-root) and hits /healthz, the REST catalogue and an MCP initialize.
      # Catches the class of bug where a COPY is missing or a dependency
      # drifted: the image builds fine and crashes at import time. The MCP
      # host guard matches host:port, hence the `localhost:*` allow-list.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /tmp -p 7860:7860 \
            -e 'OPENWIND_ALLOWED_HOSTS=localhost:*' -e OPENWIND_API_TOKEN=smoke-token \
            ohmywind-mcp:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:7860/healthz
          curl -fsS http://localhost:7860/api/v1/archetypes | head -c 300; echo
          # Token gate: 401 without, 200 with.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7860/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{}')" = "401" ]
          curl -fsS -X POST http://localhost:7860/mcp \
            -H 'Authorization: Bearer smoke-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | head -c 300; echo
          # Runs as the unprivileged user from the Dockerfile.
          [ "$(docker exec smoke id -u)" = "10001" ]
          docker logs smoke
          docker rm -f smoke

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    name: Web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          load: true
          tags: ohmywind-web:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The nginx rules mirror Cloudflare's _headers/_redirects; each one is
      # checked here so a drift between the two shows up before a deploy.
      - name: Smoke test
        run: |
          set -euo pipefail
          # No API_BASE must be a refusal to start, not a silent default.
          if docker run --rm ohmywind-web:smoke >/dev/null 2>&1; then
            echo "::error::web image started without API_BASE"; exit 1
          fi
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /var/cache/nginx \
            --tmpfs /usr/share/nginx/html:uid=101,gid=101 -e API_BASE=https://mcp.example.test \
            -p 8080:8080 ohmywind-web:smoke
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Downloads land in files first: `curl | grep -q` closes the pipe as
          # soon as it matches and, under pipefail, curl's exit 23 fails the step.
          curl -fsS -o /tmp/index.html http://localhost:8080/
          grep -q '<div id="root">' /tmp/index.html
          # The runtime URL is substituted in and the placeholder is gone.
          ENTRY=$(grep -o 'assets/index-[^"]*\.js' /tmp/index.html | head -1)
          curl -fsS -o /tmp/entry.js "http://localhost:8080/${ENTRY}"
          grep -q 'https://mcp.example.test' /tmp/entry.js
          ! grep -q '__OHMYWIND_API_BASE__' /tmp/entry.js
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/confidentialite)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)" = "404" ]
          curl -fsSI -o /tmp/sw.h http://localhost:8080/sw.js
          grep -qi 'cache-control: no-store' /tmp/sw.h
          [ "$(docker exec web id -u)" = "101" ]
          docker rm -f web

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint
        run: helm lint --strict "$CHART_DIR"

      # Renders every optional resource so a broken conditional block does not
      # hide behind the defaults, then checks the manifests against the
      # Kubernetes schemas.
      - name: Template (defaults + every feature on)
        run: |
          set -euo pipefail
          helm template ci "$CHART_DIR" > /tmp/default.yaml
          helm template ci "$CHART_DIR" \
            --set edgeSecret.value=ci-secret \
            --set atlas.enabled=true \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set web.enabled=true \
            --set web.apiBase=https://mcp.example.test \
            --set web.ingress.enabled=true \
            --set auth.token=ci-token \
            --set replicaCount=2 > /tmp/full.yaml
          wc -l /tmp/default.yaml /tmp/full.yaml

      - name: Validate against Kubernetes schemas
        run: |
          set -euo pipefail
          KUBECONFORM=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/default.yaml /tmp/full.yaml

      - name: Package and push chart
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" -d /tmp/chart
          helm push /tmp/chart/ohmywind-mcp-"$VERSION".tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
